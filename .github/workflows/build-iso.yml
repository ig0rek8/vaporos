name: Build VaporOS ISO

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Publish ISO as a GitHub Release (direct download without zip)"
        type: boolean
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-iso:
    name: Build Arch ISO (x86_64)
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space for mkarchiso
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Arch Linux builder container
        run: |
          docker build -t vaporos-builder .

      - name: Build VaporOS ISO with mkarchiso
        run: |
          mkdir -p out
          docker run --rm --privileged \
            -v "${{ github.workspace }}:/workspace" \
            vaporos-builder

      - name: Generate SHA256 checksum
        run: |
          cd out
          sha256sum vaporos-*.iso > SHA256SUMS.txt
          ls -lh
          cat SHA256SUMS.txt

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vaporos-iso
          path: |
            out/vaporos-*.iso
            out/SHA256SUMS.txt
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}"
          name: "VaporOS ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Build {0}', github.run_number) }}"
          body: |
            Ultra-Light Arch Linux Gaming OS (`linux-zen` + `gamescope` + Steam Big Picture + Hyprland).
            Download the `.iso` below and flash it to USB with Ventoy, Rufus, or `dd`.
          files: |
            out/vaporos-*.iso
            out/SHA256SUMS.txt
