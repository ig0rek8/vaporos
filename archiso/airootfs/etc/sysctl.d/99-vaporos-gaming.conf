# VaporOS Gaming & Low-Latency Kernel Tuning
# Required by many modern Steam/Proton titles (e.g. Star Citizen, Elden Ring, CS2)
vm.max_map_count = 2147483642

# Optimize for zram compressed swap in RAM
vm.swappiness = 100
vm.page-cluster = 0
vm.vfs_cache_pressure = 50
vm.dirty_background_ratio = 5
vm.dirty_ratio = 15

# Avoid severe frame drops in some Windows/Proton games
kernel.split_lock_mitigate = 0

# Low-latency networking
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
