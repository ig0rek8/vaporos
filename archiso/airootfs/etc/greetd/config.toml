# VaporOS greetd configuration — auto-login into Desktop Mode, clean tuigreet on logout
[terminal]
vt = 1

[initial_session]
command = "/usr/local/bin/vaporos-session-dispatcher"
user = "gamer"

[default_session]
command = "tuigreet --time --greeting 'VaporOS (Arch Linux) — login: gamer / pass: gamer' --cmd /usr/local/bin/vaporos-session-dispatcher"
user = "greeter"
