# VaporOS Gaming Mode Compositor Config (VM / Gamescope Fallback)
output * bg #0b0f14 solid_color
default_border none
default_floating_border none
hide_edge_borders both

input type:keyboard {
    xkb_layout "us,ru"
    xkb_options "grp:alt_shift_toggle"
}

# Force Steam Big Picture & games fullscreen
for_window [class="steam"] fullscreen enable
for_window [app_id="steam"] fullscreen enable
for_window [title="Steam Big Picture Mode"] fullscreen enable

# Emergency / quick switch back to Desktop Mode
bindsym Mod4+g exec /usr/local/bin/vaporos-switch-session desktop
bindsym Control+Mod1+d exec /usr/local/bin/vaporos-switch-session desktop
bindsym Mod4+Return exec foot

# Launch Steam Big Picture (SteamOS 3 Gamepad UI)
exec steam -gamepadui -steamos3 -steampal -steamdeck -tenfoot
