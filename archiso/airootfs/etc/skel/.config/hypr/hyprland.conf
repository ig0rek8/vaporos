# ==============================================================================
# VaporOS Hyprland Configuration (Ultra-Light SteamOS-Inspired Desktop Mode)
# ==============================================================================

monitor = , preferred, auto, 1

# --- Autostart ---
exec-once = waybar
exec-once = mako
exec-once = swaybg -c "#0e141b"
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# --- Input ---
input {
    kb_layout = us,ru
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
    }
}

# --- Visuals (Minimal GPU/RAM footprint, SteamOS palette) ---
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(1a9fffee) rgba(66c0f4ee) 45deg
    col.inactive_border = rgba(232d3baa)
    layout = dwindle
    allow_tearing = true
}

decoration {
    rounding = 8
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = true
    bezier = fast, 0.2, 0.8, 0.2, 1.0
    animation = windows, 1, 3, fast
    animation = workspaces, 1, 3, fast
    animation = fade, 1, 2, fast
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vrr = 1
}

dwindle {
    pseudotile = true
    preserve_split = true
}

# --- Keybindings ---
$mod = SUPER

bind = $mod, Return, exec, foot
bind = $mod, D, exec, fuzzel
bind = $mod, Space, exec, fuzzel
bind = $mod, E, exec, thunar
bind = $mod, G, exec, /usr/local/bin/vaporos-switch-session gaming
bind = $mod, C, exec, foot -T "VaporOS Control Center" /usr/local/bin/vaporos-ctl

bind = $mod, Q, killactive,
bind = $mod, F, fullscreen, 0
bind = $mod, V, togglefloating,
bind = $mod, P, pseudo,
bind = $mod, J, togglesplit,

# Focus movement
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

# Mouse window controls
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Media, Volume & Brightness
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set +10%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 10%-

# Screenshot (area -> clipboard)
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
